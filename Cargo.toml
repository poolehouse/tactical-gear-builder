[workspace]
resolver = "2"
members = [
    "crates/core-engine",
    "crates/data-ingest",
    "crates/api-server",
    "crates/wasm-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
slug = "0.1"
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
wasm-bindgen = "0.2"
