[workspace]
resolver = "2"
members = [
    "crates/core-engine",
    "crates/data-ingest",
    "crates/store",
    "crates/api-server",
    "crates/wasm-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# `js` routes uuid's wasm32 randomness to the browser crypto API; it is
# target-gated inside uuid and inert on native builds.
uuid = { version = "1.0", features = ["v4", "v5", "serde", "js"] }
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
slug = "0.1"
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
wasm-bindgen = "0.2"
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
tempfile = "3"
